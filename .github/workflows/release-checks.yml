name: Release checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
      CYBERVEIL_DATA_DIR: ${{ github.workspace }}/tmp/ci-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Qt system libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libgl1
      - run: python -m pip install -c constraints-release.txt '.[dev]'
      - run: python -m ruff check .
      - run: python -m mypy src/cyberveil
      - run: python -m pytest
      - run: python scripts/verify_phase3.py --output tmp/phase3-checks
      - run: python -m build --no-isolation
      - run: python -m PyInstaller --noconfirm packaging/cyberveil.spec
      - name: Frozen application smoke checks
        run: python scripts/check_package.py
      - uses: actions/upload-artifact@v4
        with:
          name: CYBERVEIL-${{ runner.os }}-${{ runner.arch }}
          path: |
            dist/
            tmp/phase3-checks/
