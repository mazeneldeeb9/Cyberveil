[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cyberveil"
version = "0.3.0"
description = "A safe academic desktop demonstrator for behavior-based fileless malware detection"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1",
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "psutil>=6,<8",
  "pydantic>=2.8,<3",
  "PySide6>=6.8,<7",
  "scikit-learn>=1.5,<2",
  "skops>=0.10,<1",
]

[project.optional-dependencies]
forensics = ["volatility3>=2.8,<3"]
dev = [
  "build>=1.2,<2",
  "setuptools>=75",
  "wheel>=0.44",
  "pyinstaller>=6.10,<7",
  "mypy>=1.11,<2",
  "pytest>=8,<9",
  "pytest-cov>=5,<8",
  "pytest-qt>=4.4,<5",
  "ruff>=0.8,<1",
  "types-psutil>=6,<8",
  "pandas-stubs>=2.2,<3",
]

[project.scripts]
cyberveil = "cyberveil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q --disable-warnings"
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["cyberveil"]

[[tool.mypy.overrides]]
module = ["skops", "skops.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cyberveil"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.setuptools.package-data]
cyberveil = ["data/models/*.skops", "data/models/*.json"]
